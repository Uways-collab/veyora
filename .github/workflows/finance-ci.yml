name: Veyora Finance CI

on:
  push:
    branches:
      - main
      - feat/finance-module
      - feat/industry-workflows-ai-assistant
      - fix/dashboard-all-roles-and-org-access
      - feat/specialist-industry-workspaces
      - feat/paystack-trial-billing
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-typecheck:
    name: Browser TypeScript check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint

  edge-function-typecheck:
    name: Supabase Edge Function Deno check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js dependencies for Deno npm imports
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Edge Function npm dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated Edge Functions
        run: |
          deno check supabase/functions/invite-organization-member/index.ts
          deno check supabase/functions/veyora-ai-assistant/index.ts
      - name: Type-check invoice scanner Edge Function
        run: deno check supabase/functions/scan-supplier-invoice/index.ts
      - name: Type-check Paystack billing Edge Functions
        run: |
          deno check supabase/functions/paystack-billing/index.ts
          deno check supabase/functions/paystack-webhook/index.ts

  production-build:
    name: Vite production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
